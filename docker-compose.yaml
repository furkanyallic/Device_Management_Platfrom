version: "3.8"

services:
  # ==========================================
  # 1. VERİTABANLARI (POSTGRESQL)
  # ==========================================
  device_postgres:
    image: postgres:15-alpine
    container_name: device_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0
      POSTGRES_DB: device_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_device_data:/var/lib/postgresql/data
    networks:
      - iot_network

  telemetry_postgres:
    image: postgres:15-alpine
    container_name: telemetry_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0
      POSTGRES_DB: telemetry_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_telemetry_data:/var/lib/postgresql/data
    networks:
      - iot_network

  alarm_postgres:
    image: postgres:15-alpine
    container_name: alarm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0
      POSTGRES_DB: alarm_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_alarm_data:/var/lib/postgresql/data
    networks:
      - iot_network

  notification_postgres:
    image: postgres:15-alpine
    container_name: iot_notification_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0
      POSTGRES_DB: notification_db
    ports:
      - "5437:5432"
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    networks:
      - iot_network

  # ==========================================
  # 2. MESAJLAŞMA & REDIS ALTYAPISI
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: iot_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - iot_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: iot_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - iot_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: iot_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iot_network

  redis:
    image: redis:7-alpine
    container_name: iot_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - iot_network

  # ==========================================
  # 3. MİKROSERVİSLER
  # ==========================================
  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: device-service
    restart: always
    environment:
      PORT: 3000
      DB_HOST: device_postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 0
      DB_NAME: device_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      - device_postgres
      - redis
    networks:
      - iot_network

  alarm-service:
    build:
      context: ./alarm-service
      dockerfile: Dockerfile
    container_name: alarm-service
    restart: always
    environment:
      PORT: 3004
      DB_HOST: alarm_postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 0
      DB_NAME: alarm_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      KAFKA_BROKER: kafka:29092
    ports:
      - "3004:3004"
    depends_on:
      alarm_postgres:
        condition: service_started
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - iot_network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    restart: always
    environment:
      PORT: 3007
      DB_HOST: telemetry_postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 0
      DB_NAME: telemetry_db
      KAFKA_BROKER: kafka:29092
    ports:
      - "3007:3007"
    depends_on:
      - telemetry_postgres
      - kafka
    networks:
      - iot_network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    environment:
      PORT: 3006
      DB_HOST: notification_postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 0
      DB_NAME: notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 465
      SMTP_USER: "yallicfurkann@gmail.com"
      SMTP_FROM: "IoT Alarm Sistemi <yallicfurkann@gmail.com>"
      SMTP_PASS: ""
      ADMIN_EMAIL: "yallicfurkann@gmail.com"
    ports:
      - "3006:3006"
    depends_on:
      notification_postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - iot_network

  telemetry-simulator:
    build:
      context: ./telemetry-simulator
      dockerfile: Dockerfile
    container_name: telemetry-simulator
    restart: always
    environment:
      PORT: 3008
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3008:3008"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - iot_network

  # ==========================================
  # 4. API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    environment:
      PORT: 3010
      DEVICE_SERVICE_URL: http://device-service:3000
      ALARM_SERVICE_URL: http://alarm-service:3004
      TELEMETRY_SERVICE_URL: http://telemetry-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    ports:
      - "3010:3010"
    depends_on:
      - device-service
      - alarm-service
      - telemetry-service
      - notification-service
    networks:
      - iot_network

  # ==========================================
  # 5. FRONTEND (REACT + VITE + NGINX)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - iot_network

# DOCKER AĞI VE VOLUMELER
networks:
  iot_network:
    driver: bridge

volumes:
  postgres_device_data:
  postgres_telemetry_data:
  postgres_alarm_data:
  notification_pg_data:
